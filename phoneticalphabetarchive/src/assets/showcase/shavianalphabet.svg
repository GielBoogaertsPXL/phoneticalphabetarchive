  <text class="cls-1" transform="translate(0 43.39)"><tspan x="0" y="0">𐑞 𐑒𐑢𐑦𐑒 𐑚𐑮𐑬𐑯 𐑓𐑭𐑒𐑕 𐑡𐑳𐑥𐑐𐑕 </tspan><tspan x="0" y="58.8">𐑴𐑝𐑼 𐑞 𐑤𐑱𐑟𐑰 𐑓𐑭𐑒𐑕. 𐑣𐑰 </tspan><tspan x="0" y="117.6">𐑛𐑦𐑛 𐑯𐑭𐑑 𐑣𐑨𐑝 𐑑, 𐑚𐑩𐑑 𐑣𐑰 </tspan><tspan x="0" y="176.4">𐑔𐑭𐑑 𐑦𐑑 𐑢𐑭𐑟 𐑞 𐑗𐑰𐑒𐑰 𐑔𐑦𐑙 </tspan><tspan x="0" y="235.2">𐑑 𐑛𐑵.</tspan></text>
