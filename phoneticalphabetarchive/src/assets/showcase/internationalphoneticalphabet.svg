  <text class="cls-1" transform="translate(0 39.89)"><tspan x="0" y="0">ðə kwɪk braʊn fɒks </tspan><tspan x="0" y="60">ʤʌmps əʊvə ðə leɪzi </tspan><tspan x="0" y="120">fɒks. hi dɪd nɒt hæv </tspan><tspan x="0" y="180">tu, bʌt hi θɔt ɪt wɒz </tspan><tspan x="0" y="240">ðə ʧiki θɪŋ tu du.</tspan></text>
