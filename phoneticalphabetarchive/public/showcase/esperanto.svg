  <text class="cls-1" transform="translate(0 35.74)"><tspan x="0" y="0">La rapida bruna vulpo </tspan><tspan x="0" y="52">supersalt la maldiligenta </tspan><tspan x="0" y="104">hundo. Li ne de</tspan><tspan class="cls-2" x="269.88" y="104">v</tspan><tspan x="288.59" y="104">, sed li </tspan><tspan x="0" y="156">opiniis, ke estas la </tspan><tspan x="0" y="208">impertinenta afero fari.</tspan></text>
